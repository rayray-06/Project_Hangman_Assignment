<!DOCTYPE html>
<html>
<head>
    <title>Select Category</title>
    <style>
        body {
            background: #9FE0E8;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 320px;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
        }
        .option {
            background: #BEEFF4;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .play {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #5ED6E3;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>SELECT<br>CATEGORY</h2>

    <form method="POST">
        <div class="option"><input type="radio" name="category" value="shapes" required> SHAPES</div>
        <div class="option"><input type="radio" name="category" value="food"> FOOD</div>
        <div class="option"><input type="radio" name="category" value="colours"> COLOURS</div>
        <div class="option"><input type="radio" name="category" value="sports"> SPORTS</div>

        <button class="play" type="submit">PLAY</button>
    </form>
</div>
</body>
</html>
