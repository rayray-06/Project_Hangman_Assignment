<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hangman Online</title>

    <!-- 
        Homepage shown when the user first opens the application and the layout is intentionally minimal to match the simplicity in the wireframes 
        and keep the entry point clear on mobile devices.
    -->
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #9FE0E8;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 
            Central container ensures the title and buttons
            stay grouped and vertically centred across screen sizes.
        */
        .container {
            width: 300px;
            text-align: center;
        }

        /* 
            Large title used to clearly communicate the game
            and match the visual emphasis in the mockups.
        */
        h1 {
            color: white;
            font-size: 34px;
            margin-bottom: 40px;
            font-weight: bold;
        }

        /* 
            Shared button styling keeps interactions consistent
            while allowing colour to differentiate actions.
        */
        .btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        /* 
            Online play is included for future expansion
            but is not implemented in the current version.
        */
        .online {
            background: #5ED6E3;
        }

        /* 
            Primary action button.
            Placed second to reduce accidental taps
            when users first load the page.
        */
        .friends {
            background: #4CAF50;
        }
    </style>
</head>

<body>

    <!-- 
        Entry point container.
        all first time user actions are available from this screen
        to avoid unnecessary navigation.
    -->
