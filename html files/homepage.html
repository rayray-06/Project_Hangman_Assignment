

<!DOCTYPE html>
<html>
<head>
    <title>Hangman Online</title>
    <style>
        body {
            background: #9FE0E8;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 300px;
            text-align: center;
        }
        h1 {
            color: white;
            font-size: 34px;
            margin-bottom: 40px;

            width: 100%;
            padding: 14px;

            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .online { background: #5ED6E3; }
    </style>
</head>

<body>
<div class="container">
    <h1>HANGMAN<br>ONLINE!</h1>
    <button class="btn online" onclick="window.location.href='/create'">PLAY WITH FRIENDS</button>

</html>
