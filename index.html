!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hangman Game</title>

    <!-- 
        Main game screen.
        This page displays the active Hangman round,including the word state player turn information and on an on screen keyboard.
    -->
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #0A3D91;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* 
            Central game container limits width so the interface
            remains readable on both mobile and desktop screens.
        */
        .container {
            width: 340px;
            text-align: center;
        }

        /* 
            Category label gives context to the word being guessed
            without distracting from gameplay.
        */
        .category {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* 
            White game card separates gameplay elements
            from the darker background to improve contrast.
        */
        .game-box {
            background: white;
            color: black;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
        }

        /* 
            Placeholder area for the Hangman drawing.
            This is updated dynamically as wrong guesses increase.
        */
        .hangman {
            height: 140px;
            background: #f1f1f1;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 
            Word display uses increased letter spacing
            to clearly distinguish unrevealed characters.
        */
        .word {
            font-size: 30px;
            letter-spacing: 10px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* 
            Turn indicator provides simple feedback
            without interrupting gameplay.
        */
        .turn {
            font-size: 14px;
        }

        /* 
            On-screen keyboard avoids reliance on physical keyboards,
            improving usability on touch devices.
        */
        .keyboard {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .key {
            width: 32px;
            height: 32px;
            background: #ffffff33;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
      <!-- 
        Game interface container. All gameplay related elements are kept on a single screen to avoid breaking player focus during a round.
    -->
    <div class="container">

        <!-- Displays the selected category for the current round -->
        <div class="category">CATEGORY</div>

        <div class="game-box">

            <!-- 
                Visual hangman representation. The drawing is updated as incorrect guesses are made.
            -->
            <div class="hangman">
                HANGMAN
            </div>
